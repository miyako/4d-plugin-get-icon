name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Require an explicit dispatch from main
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Signed packages must be dispatched from main."
            exit 1
          fi
  build:
    needs: authorize
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test.yml
  sign-package:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: native-macos
          path: .package-inputs/macos
      - uses: actions/download-artifact@v4
        with:
          name: native-windows
          path: .package-inputs/windows
      - name: Assemble verified source-bound inputs
        run: python3 scripts/package.py assemble --inputs .package-inputs --output "$RUNNER_TEMP/get-icon-package"
      - name: Developer ID sign, notarize, and package
        id: sign
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: bash scripts/sign-package.sh "$RUNNER_TEMP/get-icon-package/payload" "$RUNNER_TEMP/get-icon-distribution"
      - name: Retain notarization failure diagnostics
        if: failure() && steps.sign.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: notarization-failure-${{ github.sha }}
          path: ${{ runner.temp }}/get-icon-distribution/*-notarization*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify final archived bytes and install for smoke testing
        run: |
          VERSION=$(cat VERSION)
          cd "$RUNNER_TEMP/get-icon-distribution"
          shasum -a 256 -c SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          ditto -x -k "$RUNNER_TEMP/get-icon-distribution/get-icon-$VERSION.zip" "$RUNNER_TEMP/get-icon-extracted"
          python3 scripts/package.py verify --payload "$RUNNER_TEMP/get-icon-extracted" --manifest "$RUNNER_TEMP/get-icon-extracted/PROVENANCE.json"
          codesign --verify --strict "$RUNNER_TEMP/get-icon-extracted/get-icon.bundle"
          mkdir -p get-icon/get-icon-test/Plugins
          ditto "$RUNNER_TEMP/get-icon-extracted/get-icon.bundle" get-icon/get-icon-test/Plugins/get-icon.bundle
      - name: Smoke test the signed packaged plugin
        uses: ./.github/actions/tool4d-test
      - uses: actions/upload-artifact@v4
        with:
          name: get-icon-signed-packages-${{ github.sha }}
          path: ${{ runner.temp }}/get-icon-distribution/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: sign-package
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: get-icon-signed-packages-${{ github.sha }}
          path: .signed-distribution
      - name: Verify the downloaded final distribution
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)
          cd .signed-distribution
          shasum -a 256 -c SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          ditto -x -k ".signed-distribution/get-icon-$VERSION.zip" "$RUNNER_TEMP/publish-extracted"
          python3 scripts/package.py verify --payload "$RUNNER_TEMP/publish-extracted" --manifest "$RUNNER_TEMP/publish-extracted/PROVENANCE.json"
          TEAM=$(python3 -c "import json; print(json.load(open('.signed-distribution/PROVENANCE.json'))['expected_team'])")
          codesign --verify --strict "$RUNNER_TEMP/publish-extracted/get-icon.bundle"
          codesign --display --verbose=4 "$RUNNER_TEMP/publish-extracted/get-icon.bundle" 2> "$RUNNER_TEMP/publish-bundle-signature"
          python3 scripts/release_checks.py signature --details "$RUNNER_TEMP/publish-bundle-signature" --team "$TEAM" --runtime
          codesign --verify --strict ".signed-distribution/get-icon-$VERSION.dmg"
          codesign --display --verbose=4 ".signed-distribution/get-icon-$VERSION.dmg" 2> "$RUNNER_TEMP/publish-dmg-signature"
          python3 scripts/release_checks.py signature --details "$RUNNER_TEMP/publish-dmg-signature" --team "$TEAM"
          xcrun stapler validate ".signed-distribution/get-icon-$VERSION.dmg"
          spctl --assess --type open --context context:primary-signature ".signed-distribution/get-icon-$VERSION.dmg"
      - name: Publish new immutable version after verifying draft upload bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v$VERSION"
          set +e
          git ls-remote --exit-code origin "refs/tags/$TAG" > "$RUNNER_TEMP/existing-tag"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch --no-tags origin "refs/tags/$TAG"
            [ "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA" ] || {
              echo "::error::Existing version tag points to another commit; refusing to move it."
              exit 1
            }
          elif [ "$status" -eq 2 ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          else
            echo "::error::Could not inspect remote version tag."
            exit "$status"
          fi
          printf "Native file and folder icons for 4D 21.1+.\n\nSource commit: \`%s\`\n\nmacOS universal: Developer ID signed and notarized. Windows x64: included, not Authenticode signed. Download the ZIP for the cross-platform bundle or the signed, stapled DMG. Verify SHA256SUMS before installation.\n" "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes"
          gh release create "$TAG" .signed-distribution/* --verify-tag --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes" --draft
          gh release download "$TAG" --dir "$RUNNER_TEMP/draft-upload-check"
          cmp .signed-distribution/SHA256SUMS "$RUNNER_TEMP/draft-upload-check/SHA256SUMS"
          cd "$RUNNER_TEMP/draft-upload-check"
          shasum -a 256 -c SHA256SUMS
          [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" = "$GITHUB_SHA" ]
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
