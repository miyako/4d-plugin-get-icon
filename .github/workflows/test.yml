name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            archive: tool4d_arm64.tar.xz
          - os: windows-latest
            platform: win
            archive: tool4d_win.tar.xz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S get-icon -B get-icon/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S get-icon -B get-icon/build -A x64
      - name: Build
        id: build
        run: cmake --build get-icon/build --config Release --parallel
      - name: Native tests
        run: ctest --test-dir get-icon/build -C Release --output-on-failure
      - name: Package provenance tests
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v
      - name: 4D integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: ./.github/actions/tool4d-test
      - name: Stage tested native input
        env:
          PLATFORM: ${{ runner.os == 'macOS' && 'macos' || 'windows' }}
        run: python3 scripts/package.py stage --platform "$env:PLATFORM" --output .package-inputs
        if: runner.os == 'Windows'
      - name: Stage tested native input (macOS)
        if: runner.os == 'macOS'
        run: python3 scripts/package.py stage --platform macos --output .package-inputs
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os == 'macOS' && 'macos' || 'windows' }}
          path: .package-inputs/${{ runner.os == 'macOS' && 'macos' || 'windows' }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
  package-layout:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: native-macos
          path: .package-inputs/macos
      - uses: actions/download-artifact@v4
        with:
          name: native-windows
          path: .package-inputs/windows
      - name: Validate same-run cross-platform assembly
        run: |
          python3 scripts/package.py assemble --inputs .package-inputs --output "$RUNNER_TEMP/package-validation"
          # A test-only ad-hoc seal exercises the real combined bundle layout.
          # It is never uploaded as a distribution or accepted by production signing.
          codesign --force --sign - "$RUNNER_TEMP/package-validation/payload/get-icon.bundle"
          codesign --verify --strict "$RUNNER_TEMP/package-validation/payload/get-icon.bundle"
          codesign --verify --strict "$RUNNER_TEMP/package-validation/payload/get-icon.bundle/Contents/MacOS/get-icon"
          python3 scripts/package.py inventory --payload "$RUNNER_TEMP/package-validation/payload" --output "$RUNNER_TEMP/package-validation/payload/PROVENANCE.json"
          python3 scripts/package.py verify --payload "$RUNNER_TEMP/package-validation/payload" --manifest "$RUNNER_TEMP/package-validation/payload/PROVENANCE.json"
      - name: Exercise ZIP and DMG layout without distribution signing
        run: |
          set -euo pipefail
          PAYLOAD="$RUNNER_TEMP/package-validation/payload"
          ditto -c -k --sequesterRsrc "$PAYLOAD" "$RUNNER_TEMP/layout-check.zip"
          ditto -x -k "$RUNNER_TEMP/layout-check.zip" "$RUNNER_TEMP/layout-extracted"
          python3 scripts/package.py verify --payload "$RUNNER_TEMP/layout-extracted" --manifest "$RUNNER_TEMP/layout-extracted/PROVENANCE.json"
          hdiutil create -format UDZO -volname get-icon -srcfolder "$PAYLOAD" "$RUNNER_TEMP/layout-check.dmg"
          mkdir "$RUNNER_TEMP/layout-mounted"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/layout-mounted" "$RUNNER_TEMP/layout-check.dmg"
          trap 'hdiutil detach "$RUNNER_TEMP/layout-mounted"' EXIT
          python3 scripts/package.py verify --payload "$RUNNER_TEMP/layout-mounted" --manifest "$RUNNER_TEMP/layout-mounted/PROVENANCE.json"
          mkdir -p get-icon/get-icon-test/Plugins
          ditto "$RUNNER_TEMP/layout-extracted/get-icon.bundle" get-icon/get-icon-test/Plugins/get-icon.bundle
      - name: Smoke test combined plugin from the extracted archive
        uses: ./.github/actions/tool4d-test
