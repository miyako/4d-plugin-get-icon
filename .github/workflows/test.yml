name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            archive: tool4d_arm64.tar.xz
          - os: windows-latest
            platform: win
            archive: tool4d_win.tar.xz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S get-icon -B get-icon/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S get-icon -B get-icon/build -A x64
      - name: Build
        run: cmake --build get-icon/build --config Release --parallel
      - name: Native tests
        run: ctest --test-dir get-icon/build -C Release --output-on-failure
      - name: Resolve test runtime version
        id: version
        shell: bash
        run: |
          compat=$(python3 -c "import json; print(json.load(open('get-icon/get-icon-test/Project/get-icon.4DProject'))['compatibilityVersion'])")
          major=${compat:0:2}
          minor=$((10#${compat:2:2}))
          if [ "$minor" -lt 10 ]; then version="$major.$minor"; else version="$major R$((minor/10))"; fi
          echo "branch=$major.x" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download tool4d
        shell: bash
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          mkdir -p .local-tools
          curl --fail --location --silent --show-error \
            "https://resources-download.4d.com/release/$BRANCH/${VERSION// /%20}/latest/$PLATFORM/$ARCHIVE" \
            -o .local-tools/tool4d.tar.xz
          tar xJf .local-tools/tool4d.tar.xz -C .local-tools
      - name: 4D integration (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p get-icon/get-icon-test/Resources
          .local-tools/tool4d.app/Contents/MacOS/tool4d --dataless \
            --startup-method=test_all \
            --project="$PWD/get-icon/get-icon-test/Project/get-icon.4DProject" 2>&1 | tee .local-tools/test.log
          grep -qx PASS .local-tools/test.log
      - name: 4D integration (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force get-icon/get-icon-test/Resources | Out-Null
          $runtime = Get-ChildItem .local-tools -Filter tool4d.exe -Recurse | Select-Object -First 1
          if (!$runtime) { throw "tool4d.exe not found" }
          $output = & $runtime.FullName --dataless --startup-method=test_all "--project=$((Get-Location).Path)/get-icon/get-icon-test/Project/get-icon.4DProject" 2>&1
          $output | Write-Output
          if ($LASTEXITCODE -ne 0 -or !($output -cmatch '^PASS$')) { throw "4D integration failed" }
